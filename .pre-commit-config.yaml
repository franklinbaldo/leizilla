# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0 # Use the latest version
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version specified indirectly by pyproject.toml usually,
    # but good to align or use a recent one here.
    # For now, let's use a recent rev.
    rev: v0.4.9 # Aligned with recent stable ruff version
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix] # Apply fixes and exit if fixes were made
      - id: ruff-format
        # args: [] # No specific args needed for format usually
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0 # Use a versão mais recente do mypy
    hooks:
      - id: mypy
        args: [--no-strict-optional, --ignore-missing-imports] # Ajuste conforme a necessidade do projeto
        additional_dependencies: [types-requests] # sem stubs o hook falha (import-untyped) em wayback/doctor/crawler
  - repo: local
    hooks:
      - id: project-dag-hygiene
        name: project DAG hygiene
        entry: uv run scripts/validate_project_dag_hygiene.py
        language: system
        files: ^(docs/okf/project-dag\.md|scripts/validate_project_dag_hygiene\.py)$
        pass_filenames: false
      - id: project-dag-semantic
        name: project DAG semantic validator (okf-parser)
        entry: uv run scripts/project_dag_from_okf.py
        language: system
        files: ^(docs/okf/project-dag\.md|scripts/project_dag_from_okf\.py)$
        pass_filenames: false
ci:
  autofix_commit_msg: "style: auto-fixes from pre-commit hooks"
  autoupdate_commit_msg: "chore: pre-commit autoupdate"
