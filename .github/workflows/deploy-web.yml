name: Deploy Leizilla Web

on:
  push:
    branches: [main]
    paths: ["web/**"]
  pull_request:
    paths: ["web/**"]
  schedule:
    # ADR-0014: o espelho same-origin do Parquet (web/public/data/ro/versoes.parquet) só
    # fica fresco quando este workflow builda de novo — um push que não toca web/** nunca
    # dispara isto sozinho. ~30min depois do cron diário de parse-release.yml (06:00 UTC)
    # dá tempo de uma release nova já estar publicada no IA antes deste sync rodar.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run unit tests
        working-directory: web
        run: npm run test

      # ADR-0014: DuckDB-WASM lê este arquivo same-origin, não o item do Internet Archive
      # diretamente (archive.org não envia Access-Control-Allow-Origin para .parquet —
      # issue #223). Refaz o espelho a cada build para refletir a release corrente; se o
      # IA estiver instável, mantém a cópia já commitada em vez de falhar o deploy inteiro
      # (fail-open, mesmo padrão do resto do pipeline) — pior caso, o site serve dados de
      # um deploy anterior até o próximo sync bem-sucedido.
      - name: Sync dataset mirror from Internet Archive
        run: |
          mkdir -p web/public/data/ro
          curl -fsSL "https://archive.org/download/leizilla-dataset-ro-v0-latest/versoes.parquet" \
            -o web/public/data/ro/versoes.parquet.new \
          && mv web/public/data/ro/versoes.parquet.new web/public/data/ro/versoes.parquet \
          || echo "::warning::não foi possível sincronizar o espelho do dataset — mantendo a cópia já commitada"

      - name: Build Astro site
        working-directory: web
        run: npm run build
        env:
          PUBLIC_PARQUET_URL: ${{ vars.PUBLIC_PARQUET_URL }}
          PUBLIC_DUCKDB_CDN: ${{ vars.PUBLIC_DUCKDB_CDN }}
          PUBLIC_DUCKDB_EXT_REPO: ${{ vars.PUBLIC_DUCKDB_EXT_REPO }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium for published capture
        run: |
          mkdir -p /tmp/leizilla-published
          cd /tmp/leizilla-published
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture the page readers actually receive
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          PUBLISHED_SHA: ${{ github.sha }}
        run: |
          mkdir -p published-evidence
          cd /tmp/leizilla-published
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const url = process.env.PAGE_URL;
          const sha = process.env.PUBLISHED_SHA;
          const browser = await chromium.launch({ headless: true });
          const results = [];

          for (const [file, width, height] of [
            ['published-home-1280x900.png', 1280, 900],
            ['published-home-390x844.png', 390, 844],
          ]) {
            const page = await browser.newPage({ viewport: { width, height } });
            let response = null;
            for (let attempt = 0; attempt < 12; attempt += 1) {
              try {
                response = await page.goto(url, { waitUntil: 'networkidle', timeout: 60_000 });
                if (response?.status() === 200) break;
              } catch (error) {
                if (attempt === 11) throw error;
              }
              await page.waitForTimeout(5_000);
            }

            await page.screenshot({ path: `/home/runner/work/${process.env.GITHUB_REPOSITORY?.split('/')[1]}/${process.env.GITHUB_REPOSITORY?.split('/')[1]}/published-evidence/${file}`, fullPage: true });
            const metrics = await page.evaluate(() => {
              const filters = [...document.querySelectorAll('.filters select, .filters input[type="number"]')];
              return {
                document_client_width: document.documentElement.clientWidth,
                document_scroll_width: document.documentElement.scrollWidth,
                filter_rects: filters.map((element) => {
                  const rect = element.getBoundingClientRect();
                  return {
                    tag: element.tagName.toLowerCase(),
                    value: element.value,
                    text: element instanceof HTMLSelectElement ? element.options[element.selectedIndex]?.text ?? '' : element.getAttribute('placeholder') ?? '',
                    left: rect.left,
                    right: rect.right,
                    width: rect.width,
                  };
                }),
              };
            });
            results.push({ file, viewport: { width, height }, status: response?.status() ?? null, title: await page.title(), metrics });
            await page.close();
          }

          await browser.close();
          fs.writeFileSync(
            `/home/runner/work/${process.env.GITHUB_REPOSITORY?.split('/')[1]}/${process.env.GITHUB_REPOSITORY?.split('/')[1]}/published-evidence/published-state.json`,
            JSON.stringify({ sha, url, captured_at: new Date().toISOString(), results }, null, 2),
          );

          if (
            results.some(
              ({ status, metrics }) =>
                status !== 200 || metrics.document_scroll_width > metrics.document_client_width,
            )
          ) process.exit(1);
          EOF

      - name: Upload published visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: leizilla-published-${{ github.sha }}
          path: published-evidence
          if-no-files-found: error
          retention-days: 30
