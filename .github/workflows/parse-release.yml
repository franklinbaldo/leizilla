name: Parse + ETL + Release Dataset

on:
  schedule:
    # Diário 06:00 UTC. Antes rodava só segunda com --limit 50 x 3 fontes em
    # paralelo (até 150 parses/dia) contra um orçamento real de free-tier de
    # ~20 requisições/dia por modelo (confirmado em produção, 2026-07-14:
    # 429 RESOURCE_EXHAUSTED, quotaId GenerateRequestsPerDayPerProjectPerModel,
    # quotaValue 20) — as 3 fontes competiam pelo mesmo orçamento diário
    # inteiro num único dia da semana, desperdiçando a maior parte das
    # chamadas em 429. Pacing novo: 6+6+6=18/dia, com margem sob o teto.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      ente:
        description: "Ente federativo"
        default: "ro"
      fonte:
        description: "Fonte (casacivil, assembleia, planalto)"
        default: "casacivil"
      start_num:
        description: "Número inicial"
        default: "1"
      end_num:
        description: "Número final"
        default: "100"
      tipo:
        description: "Tipo de lei para fontes HTML (lei, lcp, decreto)"
        default: "lei"
      input_type:
        description: "Tipo de entrada: ocr ou html"
        default: "ocr"
      limit:
        description: "Máx de itens a processar por run (controle de custo)"
        default: "50"
      dataset_version:
        description: "Versão do dataset publicado no IA (inteiro)"
        default: "0"
      dry_run:
        description: "Se 'true', pula upload de parsed items e do dataset"
        default: "false"
      skip_existing:
        description: "Se 'true', pula itens já parseados em IA (incremental)"
        default: "true"
      force:
        description: "Se 'true', sobrescreve um identifier já publicado mesmo com ia_id_raw divergente (recuperação deliberada de identity collision, issue #273) — NUNCA usar em runs de rotina"
        default: "false"
      retract_ia_id_old:
        description: "Issue #308: ia_id_parsed antigo (órfão) a marcar superseded — deixe vazio para um dispatch normal, sem retratação"
        default: ""
      retract_ia_id_new:
        description: "ia_id_parsed correto que substitui retract_ia_id_old (obrigatório se este for preenchido)"
        default: ""
      retract_reason:
        description: "Motivo da retratação, opcional (ex.: 'numero corrigido, ver #308')"
        default: ""

permissions:
  contents: read
  issues: write

# Singleton: um dispatch manual nunca deve rodar ao mesmo tempo que o cron
# diário (ambos disputariam o mesmo orçamento de LLM/IA) — a segunda run
# fica na fila em vez de correr em paralelo.
concurrency:
  group: parse-release
  cancel-in-progress: false

jobs:
  # As 3 fontes agendadas rodam em SÉRIE (via `needs`), não em paralelo: cada
  # uma usa o mesmo GEMINI_API_KEY, e a cota do free tier é por modelo por
  # projeto (não por job) — rodar em paralelo só faz duas delas queimarem o
  # orçamento em 429 enquanto a primeira ainda está consumindo. O job "etl"
  # (fetch-all-parsed → consolidate → release) só depende delas via `needs`
  # e roda mesmo se algum parse individual falhar ou for pulado (if: always()),
  # em vez de compartilhar um único job monolítico onde um parse travado
  # impedia a publicação do dataset.

  parse-assembleia:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: mkdir -p /tmp/leizilla-xmls

      - name: Parse — ro/assembleia
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run leizilla parse-all \
            --ente ro --fonte assembleia \
            --start 1 --end 5000 \
            --limit 6 --output-dir /tmp/leizilla-xmls \
            --skip-existing --error-threshold 20 --upload \
            --uploaded-ids-out /tmp/uploaded-ids-assembleia.txt

      # Hand-off direto dos ia_ids uploadados nesta run para o job `etl`
      # (issue #233): a busca do IA usada por `fetch-all-parsed` tem lag de
      # indexação de ~20-60s e pode não enxergar itens recém-uploadados
      # ainda na mesma execução do workflow. `if: always()` + retention
      # curta + if-no-files-found: ignore porque o job pode não ter
      # uploadado nada (fail-open).
      - name: Upload uploaded-ids artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-ids-assembleia
          path: /tmp/uploaded-ids-assembleia.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: Notify on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-run-failure
        with:
          job-label: "parse-release / assembleia"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  parse-casacivil-lei:
    needs: parse-assembleia
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: mkdir -p /tmp/leizilla-xmls

      - name: Parse — ro/casacivil lei
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run leizilla parse-all \
            --ente ro --fonte casacivil --tipo lei \
            --start 1 --end 6000 \
            --limit 6 --output-dir /tmp/leizilla-xmls \
            --skip-existing --error-threshold 20 --upload \
            --uploaded-ids-out /tmp/uploaded-ids-casacivil-lei.txt

      # Hand-off para o job `etl` — ver comentário equivalente no job
      # parse-assembleia (issue #233).
      - name: Upload uploaded-ids artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-ids-casacivil-lei
          path: /tmp/uploaded-ids-casacivil-lei.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: Notify on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-run-failure
        with:
          job-label: "parse-release / casacivil-lei"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  parse-casacivil-lc:
    needs: parse-casacivil-lei
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: mkdir -p /tmp/leizilla-xmls

      - name: Parse — ro/casacivil lc
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run leizilla parse-all \
            --ente ro --fonte casacivil --tipo lc \
            --start 1 --end 1300 \
            --limit 6 --output-dir /tmp/leizilla-xmls \
            --skip-existing --error-threshold 20 --upload \
            --uploaded-ids-out /tmp/uploaded-ids-casacivil-lc.txt

      # Hand-off para o job `etl` — ver comentário equivalente no job
      # parse-assembleia (issue #233).
      - name: Upload uploaded-ids artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-ids-casacivil-lc
          path: /tmp/uploaded-ids-casacivil-lc.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: Notify on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-run-failure
        with:
          job-label: "parse-release / casacivil-lc"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  parse-dispatch:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: mkdir -p /tmp/leizilla-xmls

      - name: Parse batch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          DRY_RUN="${{ inputs.dry_run || 'false' }}"
          SKIP="${{ inputs.skip_existing || 'true' }}"
          FORCE="${{ inputs.force || 'false' }}"
          if [ "${DRY_RUN,,}" = "true" ]; then UPLOAD_FLAG="--no-upload"; else UPLOAD_FLAG="--upload"; fi
          if [ "${SKIP,,}" = "true" ]; then SKIP_FLAG="--skip-existing"; else SKIP_FLAG="--no-skip-existing"; fi
          FORCE_FLAG=""
          if [ "${FORCE,,}" = "true" ]; then FORCE_FLAG="--force"; fi
          uv run leizilla parse-all \
            --ente "${{ inputs.ente || 'ro' }}" \
            --fonte "${{ inputs.fonte || 'casacivil' }}" \
            --tipo "${{ inputs.tipo || 'lei' }}" \
            --start "${{ inputs.start_num || '1' }}" \
            --end "${{ inputs.end_num || '100' }}" \
            --input-type "${{ inputs.input_type || 'ocr' }}" \
            --limit "${{ inputs.limit || '50' }}" \
            --output-dir /tmp/leizilla-xmls \
            --error-threshold 20 \
            --uploaded-ids-out /tmp/uploaded-ids-dispatch.txt \
            $SKIP_FLAG \
            $UPLOAD_FLAG \
            $FORCE_FLAG

      # Hand-off para o job `etl` — ver comentário equivalente no job
      # parse-assembleia (issue #233).
      - name: Upload uploaded-ids artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-ids-dispatch
          path: /tmp/uploaded-ids-dispatch.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: Notify on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-run-failure
        with:
          job-label: "parse-release / dispatch"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Issue #308: marca um item parsed antigo/órfão como substituído por um
  # identifier correto — deliberado, só roda quando explicitamente pedido
  # (retract_ia_id_old preenchido), nunca em um dispatch normal de parse.
  # Não apaga nada no IA; só grava um marcador no parsed_meta.json antigo
  # (ver InternetArchivePublisher.mark_parsed_superseded). O job `etl`
  # abaixo já reconsolida e republica o dataset a partir do IA
  # incondicionalmente (if: always()), então uma retratação bem-sucedida
  # aqui é refletida no próximo Parquet publicado sem nenhum passo extra.
  retract-parsed:
    if: github.event_name == 'workflow_dispatch' && inputs.retract_ia_id_old != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Retract superseded parsed item
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run leizilla retract-parsed \
            --ia-id-old "${{ inputs.retract_ia_id_old }}" \
            --ia-id-new "${{ inputs.retract_ia_id_new }}" \
            --reason "${{ inputs.retract_reason || '' }}"

      - name: Notify on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-run-failure
        with:
          job-label: "parse-release / retract-parsed"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  etl:
    needs:
      [
        parse-assembleia,
        parse-casacivil-lei,
        parse-casacivil-lc,
        parse-dispatch,
        retract-parsed,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: mkdir -p /tmp/leizilla-xmls

      # Baixa os ia_ids uploadados pelos jobs parse-* nesta mesma run
      # (issue #233). if-no-artifact-found: ignore porque nenhum job pode
      # ter publicado um artefato (todos pulados/falhos/sem upload) —
      # fail-open, igual ao resto do pipeline.
      - name: Download uploaded-ids artifacts (se houver)
        uses: actions/download-artifact@v4
        with:
          pattern: uploaded-ids-*
          path: /tmp/uploaded-ids
          merge-multiple: true
          if-no-artifact-found: ignore

      - name: Merge uploaded-ids artifacts into a single extra-ids file
        run: |
          mkdir -p /tmp/uploaded-ids
          : > /tmp/extra-ids.txt
          find /tmp/uploaded-ids -type f -name '*.txt' -exec cat {} + >> /tmp/extra-ids.txt 2>/dev/null || true
          echo "ia_ids extras desta run (hand-off, issue #233): $(wc -l < /tmp/extra-ids.txt)"

      - name: Fetch all parsed XMLs from IA (cumulative Parquet)
        run: |
          uv run leizilla fetch-all-parsed \
            --ente "${{ inputs.ente || 'ro' }}" \
            --output-dir /tmp/leizilla-xmls \
            --extra-ids-file /tmp/extra-ids.txt

      - name: Consolidate XMLs → Parquet
        # `consolidate` exits 1 whenever it skips any structurally-invalid XML
        # (issue #118's XSD gate), even though it still writes a valid Parquet
        # for every row that did pass -- that exit code is an advisory signal
        # for a human to go fix the flagged file(s), not a reason to block
        # publishing the rows that are fine. continue-on-error lets the job
        # reach "Release dataset -> IA" with that partial Parquet; that step
        # already no-ops safely if the file was never written at all (e.g.
        # zero valid XMLs).
        continue-on-error: true
        run: |
          XML_COUNT=$(find /tmp/leizilla-xmls -name '*.xml' | wc -l)
          echo "XMLs disponíveis: $XML_COUNT"
          if [ "$XML_COUNT" -eq 0 ]; then
            echo "Sem XMLs para consolidar — encerrando."
            exit 0
          fi
          uv run leizilla consolidate \
            /tmp/leizilla-xmls \
            --output /tmp/leizilla-dataset.parquet \
            --ente "${{ inputs.ente || 'ro' }}"

      - name: Release dataset → IA
        if: "${{ inputs.dry_run != 'true' }}"
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          if [ ! -f /tmp/leizilla-dataset.parquet ]; then
            echo "Parquet não gerado — skip release."
            exit 0
          fi
          uv run leizilla release-dataset \
            /tmp/leizilla-dataset.parquet \
            --ente "${{ inputs.ente || 'ro' }}" \
            --version "${{ inputs.dataset_version || '0' }}"

      - name: Dry-run stats (sem upload)
        if: "${{ inputs.dry_run == 'true' }}"
        run: |
          if [ ! -f /tmp/leizilla-dataset.parquet ]; then
            echo "Parquet não gerado."
            exit 0
          fi
          uv run leizilla release-dataset \
            /tmp/leizilla-dataset.parquet \
            --ente "${{ inputs.ente || 'ro' }}" \
            --version "${{ inputs.dataset_version || '0' }}" \
            --dry-run

      - name: Publish coverage S1-S4 → IA (issue #174)
        if: "${{ inputs.dry_run != 'true' }}"
        continue-on-error: true # instrumentação: nunca deve derrubar a release do dataset
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run leizilla coverage \
            --ente "${{ inputs.ente || 'ro' }}" \
            --upload \
            --version "${{ inputs.dataset_version || '0' }}"

      - name: Notify on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-run-failure
        with:
          job-label: "parse-release / etl"
          github-token: ${{ secrets.GITHUB_TOKEN }}
