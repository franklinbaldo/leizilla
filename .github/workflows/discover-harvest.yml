name: Discover & Harvest (manifest-driven)

on:
  schedule:
    # Os 7 tipos rodam 3 de cada vez (max-parallel: 3 na matrix abaixo; ADR-0016,
    # adendo 2026-11-16). O histórico: em 2026-07-14 uma rajada de uploads fez o IA
    # recusar tudo ("Please reduce your request rate") e max-parallel: 2 ainda
    # deixava ~30% das execuções throttled (#141); desde o ADR-0016 o upload é em
    # lote por item, e o IA limita por item e por conta, não por processo.
    # O limite de recursos por job também caiu de 500 para 200 pelo mesmo
    # motivo — rajadas menores, throughput semanal total inalterado (o
    # backlog real por tipo/semana fica bem abaixo do limite de qualquer
    # forma; isto é headroom de segurança, não um corte de trabalho).
    # Diário enquanto durar o backfill de RO (2026-11-14): a colheita já pula o
    # que o index.csv do IA mostra preservado, então cada execução gasta o limite
    # só com capturas novas. Diário também mantém o cache do banco em uso — o
    # GitHub descarta cache sem acesso há 7 dias, o intervalo exato do cron semanal.
    #
    # Limite por job = 1000 capturas (ADR-0016, 2026-11-15). Conta:
    # - medido em 2026-11-15, fluxo antigo: 190 capturas em 1h43 (~33 s cada),
    #   3 PUTs + 1 derive enfileirado por captura;
    # - fluxo novo, ESTIMADO (não medido): ~6 s por captura (fetch direto a
    #   ~1 req/s + upload em lote de 25), 2,04 PUTs por captura e ~1 derive por
    #   item por execução. 1000 capturas ≈ 100 min; a 9 s (pessimista) o teto de
    #   tempo abaixo corta em ~800;
    # - HARVEST_MAX_SECONDS=7200 faz a colheita parar de baixar aos 120 min e
    #   encerrar com flush + derive — só 17 min a mais que a colheita medida, e
    #   deixa ~3h45 do teto de 360 min do job para checkout + descoberta;
    # - a 1000/dia, os ~30 mil decretos restantes cabem em ~30 execuções, não
    #   nas ~75 do limite anterior (400) nem nas ~160 do ritmo medido (190).
    # Se o IA limitar a taxa, a colheita recua (até ~10 min por lote), desiste e
    # deixa tudo 'pending' — o resumo imprime "Colheita interrompida cedo".
    #
    # Atualização 2026-11-16 (ADR-0016, adendo): quatro execuções por dia, a cada
    # 6 h (02:00, 08:00, 14:00 e 20:00 UTC), e a execução INTEIRA precisa caber
    # nesses 6 h. Antes, 7 tipos em série x 4,5 h de colheita = mais de um dia por
    # execução, e o grupo de concorrência engolia os disparos seguintes. Agora:
    # 3 tipos em paralelo (lei, lc, decreto na primeira onda), HARVEST_MAX_SECONDS
    # = 4500 s (75 min) por tipo. Conta por job, pior caso: checkout + uv sync +
    # cache ~5 min, descoberta ~10 min, colheita 75 min, fim da execução (fetch em
    # voo, flush, derive; recuo do IA) ~25 min = ~115 min; timeout-minutes: 120.
    # Pior caso do workflow: 7 jobs em 3 vagas = 3 ondas x 115 min = 345 min
    # (~5,75 h) < 360 min. Na prática só lei/lc/decreto têm backlog grande; ec,
    # resolucao, portaria e decreto-lei terminam em minutos e o total fica em
    # ~3 h. O ritmo por host da fonte é dividido (HARVEST_HOST_INTERVAL_S=3 por
    # job x 3 jobs = ~1 req/s no total, ADR-0008).
    #
    # Disparo do cron durante uma execução em andamento: o grupo de concorrência
    # (abaixo, cancel-in-progress: false) NÃO cancela a execução em curso; a nova
    # fica pendente e começa quando a anterior termina. O GitHub guarda UMA só
    # pendente por grupo: uma terceira substitui (cancela) a pendente mais velha.
    # Como a execução cabe em 6 h, o normal é não haver disparo pendente.
    - cron: "0 2 * * *"
    - cron: "0 8 * * *"
    - cron: "0 14 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      ente:
        description: "Ente federativo (ro, sp, federal)"
        default: "ro"
      fonte:
        description: "Fonte do manifesto a descobrir. assembleia crawla ~5000 páginas sequencialmente (Playwright) e pode travar por horas (#105) — só escolha manualmente quando quiser rodá-la de propósito."
        type: choice
        default: "casacivil"
        options:
          - casacivil
          - assembleia
      tipo:
        description: "Tipo (lei, lc, decreto, ec, resolucao, portaria, decreto-lei) — vazio = todos em paralelo"
        default: ""
      limit:
        description: "Limite de recursos por job"
        default: "3000"

permissions:
  contents: read
  issues: write

# Singleton: evita um dispatch manual correndo ao mesmo tempo que o cron
# semanal (ambos disputariam upload no IA e discovery duplicado).
concurrency:
  group: discover-harvest
  cancel-in-progress: false

jobs:
  # ── DISPATCH com tipo específico ──────────────────────────────────────────
  harvest-single:
    if: github.event_name == 'workflow_dispatch' && inputs.tipo != ''
    # Pinned: 'playwright install --with-deps' refuses the ubuntu-26.04 image that
    # ubuntu-latest now resolves to. Revisit when Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # Só a fonte assembleia usa Playwright. Rodar isto para casacivil derrubava
      # o job inteiro quando o runner não tem pacote de Chromium suportado
      # (2026-11-14: ubuntu-latest virou 26.04, que o Playwright 1.60 recusa).
      - if: inputs.fonte == 'assembleia'
        run: uv run playwright install chromium --with-deps

      # Achado de produção 2026-09-25 (PR #247 fixed the dedup CHECK, this
      # restores the STATE it checks against): sem isto, cada job começa de
      # um checkout limpo com data/leizilla.duckdb inexistente, então o
      # dedup-por-DB que a SequentialDiscovery agora executa nunca acha nada
      # — todo HEAD request é refeito toda semana mesmo para URLs já
      # conhecidas há meses. Cache é por tipo (não mais compartilhado entre
      # todos): cada tipo acumula seu próprio histórico run a run, e um tipo
      # não paga por descoberta de outro tipo.
      - name: Restore discovered-resources DB cache
        uses: actions/cache/restore@v4
        with:
          path: data/leizilla.duckdb
          key: discover-db-${{ inputs.tipo }}--${{ github.run_id }}
          restore-keys: |
            discover-db-${{ inputs.tipo }}--

      - name: Discover — ${{ inputs.tipo }}
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run leizilla discover \
            --ente "${{ inputs.ente }}" \
            --fonte "${{ inputs.fonte }}" \
            --tipo "${{ inputs.tipo }}"

      - name: Harvest — ${{ inputs.tipo }}
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          # Teto de tempo da colheita (s): ver a conta no topo do arquivo.
          HARVEST_MAX_SECONDS: "16200"
        run: |
          uv run leizilla harvest \
            --ente "${{ inputs.ente }}" \
            --tipo "${{ inputs.tipo }}" \
            --limit "${{ inputs.limit }}"

      - name: Save discovered-resources DB cache
        # Depois da colheita, e mesmo se ela falhar: o que a colheita marca
        # (baixado, 404 confirmado, última tentativa) precisa sobreviver até a
        # próxima execução. Salvo antes, tudo voltava a 'pending' toda semana e os
        # mesmos PDFs eram reenviados ao IA (achado de 2026-11-14).
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: data/leizilla.duckdb
          key: discover-db-${{ inputs.tipo }}--${{ github.run_id }}

      - name: Notify on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-run-failure
        with:
          job-label: "discover-harvest / ${{ inputs.tipo }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── SCHEDULED ou DISPATCH sem tipo: descoberta+harvest por tipo, escopo limitado ──
  # Achado de produção 2026-09-25 (#234): `discover` (ente ro, fonte casacivil)
  # não é scoped por tipo por padrão — uma única chamada descobre
  # lei/lc/decreto/ec/resolucao/portaria/decreto-lei de uma vez, e rodá-la
  # dentro de cada um dos 7 jobs da matrix repetia a varredura completa do
  # site 7x em série (max-parallel: 1 na época), inflando o ciclo semanal de horas
  # para potencialmente dias.
  #
  # Um job `discover-shared` único (discovery de TODOS os tipos numa
  # chamada, resultado repassado via artifact) removeu a redundância 7x mas
  # reintroduziu o mesmo problema num único job: run 36118095901 (só a
  # descoberta não-escopada, sem cache ainda) excedeu o teto de 360min do
  # job e foi cancelado pelo GitHub antes de terminar — 8 tipos discovery
  # não cabem no orçamento de um job só, mesmo sem redundância.
  #
  # Achado de produção 2026-09-25 (#251): esta é a mesma causa raiz do
  # discover-shared standalone acima — não é rate-limiting do IA, é o
  # volume total de `head_check` sequencial por número somado em UMA
  # chamada. A correção (`leizilla discover --tipo`, ver discovery.py) deixa
  # cada job da matrix descobrir só o seu próprio tipo, então nenhum job
  # paga o custo agregado dos 8 tipos — nem em série (redundância 7x) nem
  # numa única chamada monolítica (teto de 360min). Descoberta e harvest
  # ficam no MESMO job por tipo (sem discover-shared nem artifact
  # hand-off): mais simples, e o cache do DuckDB (abaixo) já é por-tipo, então
  # cada tipo acumula seu próprio dedup histórico run a run.
  harvest-parallel:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tipo == '')
    runs-on: ubuntu-latest
    # 5 setup + 10 descoberta + 75 colheita (4500 s) + ~25 encerramento = ~115 min.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # max-parallel: 3 (ADR-0016, adendo 2026-11-16). Cada tipo grava em itens
      # PRÓPRIOS do IA (tipo faz parte do identificador do item), então os jobs não
      # disputam a ração por item (bucket_tasks_queued); o limite de conta
      # (total_tasks_queued) é a preocupação, e o upload em lote mantém a taxa de
      # PUTs bem abaixo dele. Se o IA voltar a recusar por conta, volte a 1.
      # Politeness (ADR-0008): os 3 jobs batem no mesmo host do governo, então cada
      # um paceia a 3 s por requisição (HARVEST_HOST_INTERVAL_S) — ~1 req/s somado.
      # Os tipos grandes (lei, lc, decreto) vêm primeiro: são a primeira onda.
      max-parallel: 3
      matrix:
        tipo: [lei, lc, decreto, ec, resolucao, portaria, decreto-lei]

    steps:
      # Instante em que este job morre (timeout-minutes abaixo, a partir de agora).
      # Gravado logo no início, antes de descoberta e colheita: a colheita reserva o
      # fim do job para o flush, o derive e o resumo (ADR-0016, adendo 2026-11-17).
      - name: Marca o prazo do job
        run: echo "JOB_DEADLINE_EPOCH=$(( $(date +%s) + 120 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Restore discovered-resources DB cache
        # O '--' final na chave é o terminador: sem ele, o prefixo "discover-db-decreto-"
        # também casava com "discover-db-decreto-lei-" e o decreto restaurava o banco
        # do decreto-lei (achado 2026-11-17, run 44002214612).
        uses: actions/cache/restore@v4
        with:
          path: data/leizilla.duckdb
          key: discover-db-${{ matrix.tipo }}--${{ github.run_id }}
          restore-keys: |
            discover-db-${{ matrix.tipo }}--

      - name: Discover — ${{ matrix.tipo }}
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run leizilla discover \
            --ente "${{ inputs.ente || 'ro' }}" \
            --fonte "${{ inputs.fonte || 'casacivil' }}" \
            --tipo "${{ matrix.tipo }}"

      - name: Harvest — ${{ matrix.tipo }}
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          # Teto da colheita (s). O tempo efetivo é o menor entre este teto e o que
          # sobra até o prazo do job (--job-deadline, menos 20 min de reserva para
          # flush/derive/resumo): uma descoberta lenta encurta a colheita, não o job.
          HARVEST_MAX_SECONDS: "4500"
          # 3 jobs em paralelo no mesmo host: 3 s cada = ~1 req/s no total.
          HARVEST_HOST_INTERVAL_S: "3.0"
        run: |
          uv run leizilla harvest \
            --ente "${{ inputs.ente || 'ro' }}" \
            --tipo "${{ matrix.tipo }}" \
            --limit "${{ inputs.limit || '3000' }}" \
            --job-deadline "${JOB_DEADLINE_EPOCH}"

      - name: Save discovered-resources DB cache
        # Depois da colheita, e mesmo se ela falhar: o que a colheita marca
        # (baixado, 404 confirmado, última tentativa) precisa sobreviver até a
        # próxima execução. Salvo antes, tudo voltava a 'pending' toda semana e os
        # mesmos PDFs eram reenviados ao IA (achado de 2026-11-14).
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: data/leizilla.duckdb
          key: discover-db-${{ matrix.tipo }}--${{ github.run_id }}

      - name: Notify on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-run-failure
        with:
          job-label: "discover-harvest / ${{ matrix.tipo }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
