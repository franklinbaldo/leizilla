name: Discover & Harvest (manifest-driven)

on:
  schedule:
    # Sábado 02:00 UTC — os 7 tipos rodam em sequência, um job de cada vez
    # (max-parallel na matrix abaixo), pra não fazer o IA recusar a rajada
    # de uploads como spam (achado de produção, 2026-07-14). max-parallel: 2
    # ainda deixava ~30% das execuções serem throttled pelo IA (#141); o
    # limite de recursos por job também caiu de 500 para 200 pelo mesmo
    # motivo — rajadas menores, throughput semanal total inalterado (o
    # backlog real por tipo/semana fica bem abaixo do limite de qualquer
    # forma; isto é headroom de segurança, não um corte de trabalho).
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      ente:
        description: "Ente federativo (ro, sp, federal)"
        default: "ro"
      fonte:
        description: "Fonte do manifesto a descobrir. assembleia crawla ~5000 páginas sequencialmente (Playwright) e pode travar por horas (#105) — só escolha manualmente quando quiser rodá-la de propósito."
        type: choice
        default: "casacivil"
        options:
          - casacivil
          - assembleia
      tipo:
        description: "Tipo (lei, lc, decreto, ec, resolucao, portaria, decreto-lei) — vazio = todos em paralelo"
        default: ""
      limit:
        description: "Limite de recursos por job"
        default: "200"

permissions:
  contents: read
  issues: write

# Singleton: evita um dispatch manual correndo ao mesmo tempo que o cron
# semanal (ambos disputariam upload no IA e discovery duplicado).
concurrency:
  group: discover-harvest
  cancel-in-progress: false

jobs:
  # ── DISPATCH com tipo específico ──────────────────────────────────────────
  harvest-single:
    if: github.event_name == 'workflow_dispatch' && inputs.tipo != ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run playwright install chromium --with-deps

      - name: Discover
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: uv run leizilla discover --ente "${{ inputs.ente }}" --fonte "${{ inputs.fonte }}"

      - name: Harvest — ${{ inputs.tipo }}
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run leizilla harvest \
            --ente "${{ inputs.ente }}" \
            --tipo "${{ inputs.tipo }}" \
            --limit "${{ inputs.limit }}"

      - name: Notify on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-run-failure
        with:
          job-label: "discover-harvest / ${{ inputs.tipo }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── SCHEDULED ou DISPATCH sem tipo: todos os tipos, paralelismo limitado ──
  harvest-parallel:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tipo == '')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # max-parallel: 1 (serializa os 7 jobs) — os 7 jobs rodando ao mesmo
      # tempo (max-parallel: 7, o default) fariam upload pro IA em paralelo;
      # uma rajada assim levou o IA a recusar uploads como spam em produção
      # (2026-07-14: "Please reduce your request rate"). `_run_ia_upload`
      # (publisher.py) já paceia/retry POR PROCESSO (rate limiter interno +
      # backoff exponencial em erro transiente), mas isso não protege contra
      # múltiplos PROCESSOS distintos batendo no IA ao mesmo tempo — dois
      # processos a ~1 req/2s cada já dobram a taxa efetiva vista pelo IA.
      # max-parallel: 2 ainda deixava ~30% das execuções throttled (#141);
      # serializar totalmente é o próximo degrau de segurança. Isso alonga o
      # tempo de relógio do workflow como um todo (até 7x pior caso), mas não
      # o tempo de CADA job — o teto de 360min é por job, não cumulativo — e
      # o throughput semanal total (soma dos 7 `--limit`) não muda.
      max-parallel: 1
      matrix:
        tipo: [lei, lc, decreto, ec, resolucao, portaria, decreto-lei]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run playwright install chromium --with-deps

      - name: Discover (ente ro)
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: uv run leizilla discover --ente "${{ inputs.ente || 'ro' }}" --fonte "${{ inputs.fonte || 'casacivil' }}"

      - name: Harvest — ${{ matrix.tipo }}
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run leizilla harvest \
            --ente "${{ inputs.ente || 'ro' }}" \
            --tipo "${{ matrix.tipo }}" \
            --limit "${{ inputs.limit || '200' }}"

      - name: Notify on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-run-failure
        with:
          job-label: "discover-harvest / ${{ matrix.tipo }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
