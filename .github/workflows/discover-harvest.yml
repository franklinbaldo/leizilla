name: Discover & Harvest (manifest-driven)

on:
  schedule:
    # Sábado 02:00 UTC — os 7 tipos rodam em sequência, um job de cada vez
    # (max-parallel na matrix abaixo), pra não fazer o IA recusar a rajada
    # de uploads como spam (achado de produção, 2026-07-14). max-parallel: 2
    # ainda deixava ~30% das execuções serem throttled pelo IA (#141); o
    # limite de recursos por job também caiu de 500 para 200 pelo mesmo
    # motivo — rajadas menores, throughput semanal total inalterado (o
    # backlog real por tipo/semana fica bem abaixo do limite de qualquer
    # forma; isto é headroom de segurança, não um corte de trabalho).
    - cron: "0 2 * * 6"
  workflow_dispatch:
    inputs:
      ente:
        description: "Ente federativo (ro, sp, federal)"
        default: "ro"
      fonte:
        description: "Fonte do manifesto a descobrir. assembleia crawla ~5000 páginas sequencialmente (Playwright) e pode travar por horas (#105) — só escolha manualmente quando quiser rodá-la de propósito."
        type: choice
        default: "casacivil"
        options:
          - casacivil
          - assembleia
      tipo:
        description: "Tipo (lei, lc, decreto, ec, resolucao, portaria, decreto-lei) — vazio = todos em paralelo"
        default: ""
      limit:
        description: "Limite de recursos por job"
        default: "200"

permissions:
  contents: read
  issues: write

# Singleton: evita um dispatch manual correndo ao mesmo tempo que o cron
# semanal (ambos disputariam upload no IA e discovery duplicado).
concurrency:
  group: discover-harvest
  cancel-in-progress: false

jobs:
  # ── DISPATCH com tipo específico ──────────────────────────────────────────
  harvest-single:
    if: github.event_name == 'workflow_dispatch' && inputs.tipo != ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run playwright install chromium --with-deps

      # Achado de produção 2026-09-25 (PR #247 fixed the dedup CHECK, this
      # restores the STATE it checks against): sem isto, cada job começa de
      # um checkout limpo com data/leizilla.duckdb inexistente, então o
      # dedup-por-DB que a SequentialDiscovery agora executa nunca acha nada
      # — todo HEAD request é refeito toda semana mesmo para URLs já
      # conhecidas há meses. Cache é por tipo (não mais compartilhado entre
      # todos): cada tipo acumula seu próprio histórico run a run, e um tipo
      # não paga por descoberta de outro tipo.
      - name: Restore discovered-resources DB cache
        uses: actions/cache/restore@v4
        with:
          path: data/leizilla.duckdb
          key: discover-db-${{ inputs.tipo }}-${{ github.run_id }}
          restore-keys: |
            discover-db-${{ inputs.tipo }}-

      - name: Discover — ${{ inputs.tipo }}
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run leizilla discover \
            --ente "${{ inputs.ente }}" \
            --fonte "${{ inputs.fonte }}" \
            --tipo "${{ inputs.tipo }}"

      - name: Save discovered-resources DB cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: data/leizilla.duckdb
          key: discover-db-${{ inputs.tipo }}-${{ github.run_id }}

      - name: Harvest — ${{ inputs.tipo }}
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run leizilla harvest \
            --ente "${{ inputs.ente }}" \
            --tipo "${{ inputs.tipo }}" \
            --limit "${{ inputs.limit }}"

      - name: Notify on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-run-failure
        with:
          job-label: "discover-harvest / ${{ inputs.tipo }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ── SCHEDULED ou DISPATCH sem tipo: descoberta+harvest por tipo, escopo limitado ──
  # Achado de produção 2026-09-25 (#234): `discover` (ente ro, fonte casacivil)
  # não é scoped por tipo por padrão — uma única chamada descobre
  # lei/lc/decreto/ec/resolucao/portaria/decreto-lei de uma vez, e rodá-la
  # dentro de cada um dos 7 jobs da matrix repetia a varredura completa do
  # site 7x em série (max-parallel: 1), inflando o ciclo semanal de horas
  # para potencialmente dias.
  #
  # Um job `discover-shared` único (discovery de TODOS os tipos numa
  # chamada, resultado repassado via artifact) removeu a redundância 7x mas
  # reintroduziu o mesmo problema num único job: run 36118095901 (só a
  # descoberta não-escopada, sem cache ainda) excedeu o teto de 360min do
  # job e foi cancelado pelo GitHub antes de terminar — 8 tipos discovery
  # não cabem no orçamento de um job só, mesmo sem redundância.
  #
  # Achado de produção 2026-09-25 (#251): esta é a mesma causa raiz do
  # discover-shared standalone acima — não é rate-limiting do IA, é o
  # volume total de `head_check` sequencial por número somado em UMA
  # chamada. A correção (`leizilla discover --tipo`, ver discovery.py) deixa
  # cada job da matrix descobrir só o seu próprio tipo, então nenhum job
  # paga o custo agregado dos 8 tipos — nem em série (redundância 7x) nem
  # numa única chamada monolítica (teto de 360min). Descoberta e harvest
  # ficam no MESMO job por tipo (sem discover-shared nem artifact
  # hand-off): mais simples, e o cache do DuckDB (abaixo) já é por-tipo, então
  # cada tipo acumula seu próprio dedup histórico run a run.
  harvest-parallel:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.tipo == '')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # max-parallel: 1 (serializa os 7 jobs) — os 7 jobs rodando ao mesmo
      # tempo (max-parallel: 7, o default) fariam upload pro IA em paralelo;
      # uma rajada assim levou o IA a recusar uploads como spam em produção
      # (2026-07-14: "Please reduce your request rate"). `_run_ia_upload`
      # (publisher.py) já paceia/retry POR PROCESSO (rate limiter interno +
      # backoff exponencial em erro transiente), mas isso não protege contra
      # múltiplos PROCESSOS distintos batendo no IA ao mesmo tempo — dois
      # processos a ~1 req/2s cada já dobram a taxa efetiva vista pelo IA.
      # max-parallel: 2 ainda deixava ~30% das execuções throttled (#141);
      # serializar totalmente é o próximo degrau de segurança. Isso alonga o
      # tempo de relógio do workflow como um todo, mas não o tempo de CADA
      # job — o teto de 360min é por job, não cumulativo — e o throughput
      # semanal total (soma dos 7 `--limit`) não muda. A descoberta de cada
      # job agora é escopada ao seu próprio tipo (--tipo), não mais a fonte
      # inteira — bem mais rápido que descobrir todos os tipos por job.
      max-parallel: 1
      matrix:
        tipo: [lei, lc, decreto, ec, resolucao, portaria, decreto-lei]

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Restore discovered-resources DB cache
        uses: actions/cache/restore@v4
        with:
          path: data/leizilla.duckdb
          key: discover-db-${{ matrix.tipo }}-${{ github.run_id }}
          restore-keys: |
            discover-db-${{ matrix.tipo }}-

      - name: Discover — ${{ matrix.tipo }}
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run leizilla discover \
            --ente "${{ inputs.ente || 'ro' }}" \
            --fonte "${{ inputs.fonte || 'casacivil' }}" \
            --tipo "${{ matrix.tipo }}"

      - name: Save discovered-resources DB cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: data/leizilla.duckdb
          key: discover-db-${{ matrix.tipo }}-${{ github.run_id }}

      - name: Harvest — ${{ matrix.tipo }}
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          uv run leizilla harvest \
            --ente "${{ inputs.ente || 'ro' }}" \
            --tipo "${{ matrix.tipo }}" \
            --limit "${{ inputs.limit || '200' }}"

      - name: Notify on failure
        if: ${{ failure() || cancelled() }}
        uses: ./.github/actions/notify-run-failure
        with:
          job-label: "discover-harvest / ${{ matrix.tipo }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
